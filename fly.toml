# Mintboard.
#
# Next.js needs a real Node runtime, so this is a plain container rather than
# anything clever.
app = 'mintboard'
primary_region = 'sjc'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # One machine stays warm, and it is the bot that decides this.
  #
  # Scaling to zero suited a board: bursty, and a second of wake-up costs a
  # reader nothing. But this host now answers Discord interactions, where the
  # budget is a hard three seconds for the WHOLE round trip and a miss is
  # user-visible — "City Bot didn't respond in time", which we have already
  # shipped once. A suspended machine resuming inside that window is likely,
  # not certain, and likely is the wrong standard for a button somebody is
  # pressing in front of their friends.
  #
  # The second machine still scales away; only the floor changed.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  # A health check that hits a route actually doing work, not a static file.
  # A process that is up but cannot answer a board query is not healthy, and
  # a check on '/' would never notice.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/board?address=0x0000000000000000000000000000000000000001'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
